version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: passe_digital_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: passe_digital_secretaria_da_educacao

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: