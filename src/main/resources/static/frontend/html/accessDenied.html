<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Negado | Passe Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#2563EB', 'brand-dark': '#1E40AF', background: '#F3F4F6', card: '#FFFFFF', text: '#1F2937' } } } }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-background text-text">
  <main class="flex min-h-screen items-center justify-center px-4 py-12">
    <section class="w-full max-w-3xl rounded-[32px] bg-white p-10 text-center shadow-xl ring-1 ring-slate-200">
      <div class="inline-flex h-16 w-16 items-center justify-center rounded-full bg-brand/10 text-3xl text-brand">
        &#x26A0;
      </div>
      <h1 class="mt-6 text-3xl font-semibold text-text">Acesso negado</h1>
      <p class="mt-4 text-base leading-7 text-slate-600">Você não possui permissão para acessar esta área. Faça login com um usuário autorizado ou contate o administrador.</p>
      <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:justify-center">
        <a href="/frontend/html/user/login.html" class="inline-flex items-center justify-center rounded-2xl bg-brand px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark">Ir para Login</a>
        <a href="/frontend/html/app.html" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">Ir para Dashboard</a>
      </div>
    </section>
  </main>
</body>
</html>
