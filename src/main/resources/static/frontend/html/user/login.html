<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Passe Digital | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#2563EB', 'brand-dark': '#1E40AF', background: '#F3F4F6', card: '#FFFFFF', text: '#1F2937' } } } }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-panel { backdrop-filter: blur(18px); }
  </style>
</head>
<body class="min-h-screen bg-background text-text">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-lg overflow-hidden rounded-3xl bg-white/95 shadow-2xl ring-1 ring-slate-200">
      <div class="px-8 py-10 sm:px-10">
        <div class="mb-8 flex items-center justify-between">
          <div>
            <p class="text-sm uppercase tracking-[0.28em] text-slate-500">Bem-vindo a</p>
            <h2 class="mt-3 text-3xl font-semibold text-text">Passe Digital</h2>
          </div>
          <div class="rounded-3xl bg-slate-100 px-4 py-3 text-sm text-slate-600">Login seguro</div>
        </div>

        <form id="loginForm" class="space-y-6">
          <div>
            <label for="registration" class="block text-sm font-medium text-slate-700">Matrícula</label>
            <input id="registration" name="registration" type="text" placeholder="1234567" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20" />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700">Senha</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20" />
          </div>

          <div id="statusMessage" class="min-h-[1.5rem] text-sm text-red-600"></div>

          <button id="submitButton" type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-200/30 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500/40 disabled:cursor-not-allowed disabled:opacity-70">
            Entrar
          </button>

          <div class="mt-4 text-center">
            <a href="forgot-password.html" class="text-sm font-medium text-brand transition hover:text-brand-dark">Esqueceu sua senha?</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="../../js/auth.js?v=2"></script>
  <script src="../../js/login.js?v=2"></script>
</body>
</html>
