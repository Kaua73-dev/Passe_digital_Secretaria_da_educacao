<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Passe Digital | Validação de código</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: '#2563EB', 'brand-dark': '#1E40AF', background: '#F3F4F6', card: '#FFFFFF', text: '#1F2937' } } } }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-panel { backdrop-filter: blur(18px); }
  </style>
</head>
<body class="min-h-screen bg-background text-text">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-lg overflow-hidden rounded-3xl bg-white/95 shadow-2xl ring-1 ring-slate-200">
      <div class="px-8 py-10 sm:px-10">
        <div class="mb-8">
          <p class="text-sm uppercase tracking-[0.28em] text-slate-500">Recuperação</p>
          <h2 class="mt-3 text-3xl font-semibold text-text">Validação de código</h2>
          <p class="mt-4 text-sm leading-6 text-slate-600">Digite o código de 6 caracteres (0-9, A-Z) enviado para seu e-mail.</p>
        </div>

        <form id="validateCodeForm" class="space-y-6">
          <div>
            <label for="code" class="block text-sm font-medium text-slate-700">Código</label>
            <input id="code" name="code" type="text" inputmode="text" maxlength="6" placeholder="A1B2CW" required class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20" />
          </div>

          <div id="statusMessage" class="min-h-[1.5rem] text-sm text-red-600"></div>

          <button id="submitButton" type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-brand px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-brand/20 transition hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-brand/50 disabled:cursor-not-allowed disabled:opacity-70">
            Validar código
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="../../js/auth.js?v=2"></script>
  <script src="../../js/validateCode.js?v=2"></script>
</body>
</html>
