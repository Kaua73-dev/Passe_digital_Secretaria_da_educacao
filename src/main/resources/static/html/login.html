<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/login.css">
        <title>Login</title>
    </head>
    <body>
        <header>

        </header>

        <section>
            <div id="card_background">
                <div class="background_card_login">
                    <img src="../imagens/carteirinha.svg" alt="Carteirinha estudantil">
                    <h1 class="text">Carteirinha <br> Estudantil <br> <span>Online</span></h1>
                    <h2 id="title" class="text">Vantagens:</h2>
                    <p id="a" class="text">Agora você pode acessar sua carteirinha a qualquer momento <br> e em qualquer lugar.
                        Sem chance de perder-lá, e com mais praticidade no seu dia a dia.
                    </p>
                </div>
                <div class="card_login">
                    <div class="card_login_principal">
                        <h2 id="login_title">Login</h2>
                        <p class="text2">Acesse sua carteirinha estudantil.</p>
                        <p class="texto_textbox" >Matrícula</p>
                        <form>
                            <input class="senha_matricula" type="text" placeholder="Digite sua matrícula">
                        </form>
                        <p class="texto_textbox">Senha</p>
                        <form>
                            <input class="senha_matricula" type="text" placeholder="Digite sua senha">
                        </form>
                        <button id="botao_login">Fazer Login</button>
                        <p class="text2" id="esqueceu_senha">Esqueceu sua senha? <a href="trocar_senha.html" id="clique_aqui"> Clique aqui</a></p>

                    </div>
                </div>
            </div>
        </section>

        
    </body>
</html>
